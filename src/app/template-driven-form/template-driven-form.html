
<section class="form-section">
  <header class="section-header">
    <div>
      <span class="section-tag">ABORDAGEM 01 · TEMPLATE-DRIVEN</span>
      <h1>Abertura de chamado</h1>
      <p>Informe os dados abaixo para registrar sua solicitação junto à equipe de suporte.</p>
    </div>
  </header>

  <form>
    <fieldset>
      <legend>01. Identificação</legend>

      <div class="form-grid">
        <div class="form-group full-width">
          <label for="nome">Nome completo *</label>

          <input
            type="text"
            id="nome"
            name="nome"
            placeholder="Digite seu nome completo"
          />
        </div>

        <div class="form-group">
          <label for="email">E-mail corporativo *</label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="nome@empresa.com"
          />
        </div>

        <div class="form-group">
          <label for="departamento">Departamento *</label>

          <select id="departamento" name="departamento">
            <option value="" disabled selected>Selecione</option>
            <option value="Financeiro">Financeiro</option>
            <option value="Recursos Humanos">Recursos Humanos</option>
            <option value="Tecnologia">Tecnologia</option>
            <option value="Comercial">Comercial</option>
            <option value="Administrativo">Administrativo</option>
          </select>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>02. Detalhes da solicitação</legend>

      <div class="form-grid">
        <div class="form-group">
          <label for="categoria">Categoria *</label>

          <select id="categoria" name="categoria">
            <option value="" disabled selected>Selecione uma categoria</option>
            <option value="Acesso ao sistema">Acesso ao sistema</option>
            <option value="Equipamento">Equipamento</option>
            <option value="Rede e internet">Rede e internet</option>
            <option value="Software">Software</option>
            <option value="Outros">Outros</option>
          </select>
        </div>

        <div class="form-group">
          <label for="prioridade">Prioridade *</label>

          <select id="prioridade" name="prioridade">
            <option value="baixa">Baixa</option>
            <option value="media" selected>Média</option>
            <option value="alta">Alta</option>
          </select>
        </div>

        <div class="form-group full-width">
          <label for="descricao">Descrição do problema *</label>

          <textarea
            id="descricao"
            name="descricao"
            rows="5"
            placeholder="Descreva o problema, informe quando começou e outros detalhes relevantes..."
          ></textarea>

          <span class="field-hint">
            Descreva sua solicitação com o máximo de detalhes possível.
          </span>
        </div>
      </div>
    </fieldset>

    <footer class="form-footer">
      <div class="terms-area">
        <label class="checkbox-option">
          <input type="checkbox" name="aceitaTermos" />
          <span>Confirmo que as informações fornecidas estão corretas.</span>
        </label>
      </div>

      <button type="submit">
        Registrar chamado
        <span aria-hidden="true">→</span>
      </button>
    </footer>

    <p class="required-hint">* Campos de preenchimento obrigatório</p>
  </form>
</section>
